name: DEV - Pruebas de portafolio y MVP AVIOR

on:
  workflow_call:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  portfolio-backend:
    name: Portafolio - backend unitarios e integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portafolio_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d portafolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portafolio_test

  portfolio-frontend:
    name: Portafolio - frontend unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend

  portfolio-e2e:
    name: Portafolio - E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portafolio
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d portafolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Instalar dependencias del backend (lo usa el servidor E2E)
        run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portafolio
          AUTO_MIGRATE: "true"

  mvp-unit:
    name: MVP AVIOR - unitarios frontend y backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mvp-avior/backend/package-lock.json
            mvp-avior/frontend/package-lock.json
      - run: npm ci
        working-directory: mvp-avior/backend
      - run: npm run test:unit
        working-directory: mvp-avior/backend
      - run: npm ci
        working-directory: mvp-avior/frontend
      - run: npm run test:unit
        working-directory: mvp-avior/frontend

  mvp-integration:
    name: MVP AVIOR - integración API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mvp_avior_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d mvp_avior_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mvp-avior/backend/package-lock.json
      - run: npm ci
        working-directory: mvp-avior/backend
      - run: npm run test:integration
        working-directory: mvp-avior/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mvp_avior_test

  mvp-e2e:
    name: MVP AVIOR - E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mvp-avior/frontend/package-lock.json
      - run: npm ci
        working-directory: mvp-avior/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: mvp-avior/frontend
      - run: npm run test:e2e
        working-directory: mvp-avior/frontend

