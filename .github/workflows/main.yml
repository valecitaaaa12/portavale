name: MAIN - pruebas, Docker Hub, Terraform y despliegue

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portavale-main-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Verificar las dos prácticas
    uses: ./.github/workflows/dev.yml

  dockerhub:
    name: Construir y publicar las cuatro imágenes
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portafolio-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portafolio-frontend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portafolio-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portafolio-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./mvp-avior/frontend
          push: true
          build-args: VITE_API_URL=/mvp-api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mvp-avior-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mvp-avior-frontend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./mvp-avior/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mvp-avior-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mvp-avior-backend:${{ github.sha }}

  terraform:
    name: Terraform - crear la VM Ubuntu 24.04 en OCI
    needs: dockerhub
    runs-on: ubuntu-latest
    environment: oci-production
    outputs:
      public_ip: ${{ steps.apply.outputs.public_ip }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0
      - name: Preparar credencial temporal de OCI
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          test -n "$OCI_PRIVATE_KEY"
          printf '%s\n' "$OCI_PRIVATE_KEY" > oci_api_key.pem
          chmod 600 oci_api_key.pem
      - name: Preparar estado remoto privado en OCI Object Storage
        env:
          OCI_OBJECT_STORAGE_NAMESPACE: ${{ secrets.OCI_OBJECT_STORAGE_NAMESPACE }}
          OCI_STATE_BUCKET: ${{ secrets.OCI_STATE_BUCKET }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          test -n "$OCI_OBJECT_STORAGE_NAMESPACE"
          test -n "$OCI_STATE_BUCKET"
          test -n "$OCI_REGION"
          cat > backend.hcl <<EOF
          bucket = "$OCI_STATE_BUCKET"
          key = "portavale/terraform.tfstate"
          namespace = "$OCI_OBJECT_STORAGE_NAMESPACE"
          region = "$OCI_REGION"
          auth = "APIKey"
          EOF
      - name: Inicializar Terraform con estado remoto
        env:
          OCI_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_user_ocid: ${{ secrets.OCI_USER_OCID }}
          OCI_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          OCI_private_key_path: ${{ github.workspace }}/terraform/oci_api_key.pem
          OCI_region: ${{ secrets.OCI_REGION }}
        run: |
          test -n "$OCI_tenancy_ocid"
          test -n "$OCI_user_ocid"
          test -n "$OCI_fingerprint"
          terraform init -input=false -backend-config=backend.hcl
      - name: Crear la infraestructura (VCN, subnet, VM con IP pública)
        id: apply
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ github.workspace }}/terraform/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform apply -input=false -auto-approve
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - if: always()
        run: rm -f oci_api_key.pem backend.hcl

  deploy:
    name: Configurar VM y desplegar los dos proyectos
    needs: [dockerhub, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear credenciales temporales
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_PUBLIC_IP: ${{ needs.terraform.outputs.public_ip }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$VM_PUBLIC_IP"
          printf '%s\n' "$SSH_PRIVATE_KEY" > oci_key
          chmod 600 oci_key
          printf '[portafolio]\n%s ansible_user=ubuntu ansible_ssh_private_key_file=%s/oci_key ansible_python_interpreter=/usr/bin/python3\n' "$VM_PUBLIC_IP" "$GITHUB_WORKSPACE" > ansible/inventory.ini
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ansible
      - name: Instalar en VM y levantar servicios
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MVP_POSTGRES_PASSWORD: ${{ secrets.MVP_POSTGRES_PASSWORD }}
          MVP_JWT_SECRET: ${{ secrets.MVP_JWT_SECRET }}
          MVP_ADMIN_USERNAME: ${{ secrets.MVP_ADMIN_USERNAME }}
          MVP_ADMIN_PASSWORD: ${{ secrets.MVP_ADMIN_PASSWORD }}
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
      - if: always()
        run: rm -f oci_key ansible/inventory.ini
