server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /mvp-api/ {
    proxy_pass http://mvp-backend:5001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /uploads/ {
    proxy_pass http://mvp-backend:5001/uploads/;
  }

  location /mvp/ {
    proxy_pass http://mvp-frontend:80/;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
