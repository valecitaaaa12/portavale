services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: mvp_avior
    volumes: [avior_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mvp_avior"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME}/mvp-avior-backend:latest
    restart: unless-stopped
    environment:
      PORT: 5001
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/mvp_avior
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Define ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      SEED_DEMO_DATA: "false"
      AUTO_MIGRATE: "true"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
  frontend:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME}/mvp-avior-frontend:latest
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
volumes:
  avior_db:
