name: MAIN · Pruebas y despliegue AVIOR
on:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend · unit e integración
        working-directory: backend
        run: npm ci && npm test
      - name: Frontend · unit y build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Flujos de usuario E2E
        working-directory: frontend
        run: npm run test:e2e
  publish:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar imágenes
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t "$DOCKERHUB_USERNAME/mvp-avior-frontend:latest" ./frontend
          docker push "$DOCKERHUB_USERNAME/mvp-avior-frontend:latest"
          docker build -t "$DOCKERHUB_USERNAME/mvp-avior-backend:latest" ./backend
          docker push "$DOCKERHUB_USERNAME/mvp-avior-backend:latest"
  terraform:
    needs: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      public_ip: ${{ steps.apply.outputs.public_ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: Preparar clave OCI
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: printf '%s' "$OCI_PRIVATE_KEY" > oci_api_key.pem && chmod 600 oci_api_key.pem
      - run: terraform init -input=false
      - id: apply
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ github.workspace }}/terraform/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve -input=false && echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
  configure:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Ansible
        run: pip install ansible
      - name: Preparar llave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: printf '%s' "$SSH_PRIVATE_KEY" > oci_key && chmod 600 oci_key
      - name: Ejecutar configuración de la VM
        env:
          PUBLIC_IP: ${{ needs.terraform.outputs.public_ip }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          printf '[avior]\n%s ansible_user=ubuntu ansible_ssh_private_key_file=%s/oci_key ansible_python_interpreter=/usr/bin/python3\n' "$PUBLIC_IP" "$GITHUB_WORKSPACE" > ansible/inventory.ini
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
