# Routes for Práctica 3.2 and the AVIOR MVP, added to the existing AVIOR site's server.
# The existing site's root location and content remain in place.
location ^~ /practicas/portafolio-api/ {
    proxy_pass http://portavale-portfolio-api:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /practicas/portafolio/ {
    proxy_pass http://portavale-portfolio-web/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /practicas/mvp-api/ {
    proxy_pass http://portavale-mvp-api:5001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /practicas/mvp-uploads/ {
    proxy_pass http://portavale-mvp-api:5001/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /practicas/mvp/ {
    proxy_pass http://portavale-mvp-web/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
